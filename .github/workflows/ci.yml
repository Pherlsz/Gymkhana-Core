name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "VERSION"
      - "CHANGELOG.md"
      - "scripts/release-version.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Validate semantic version carried by this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if base_version="$(git show "${BASE_SHA}:VERSION" 2>/dev/null)"; then
            :
          else
            base_version="$(
              git show "${BASE_SHA}:.release-please-manifest.json" |
                python -c 'import json,sys; print(json.load(sys.stdin)["."])'
            )"
          fi
          python scripts/release-version.py check \
            --base-version "$base_version" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"

      - name: Check formatting
        run: make format-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Install heavy quality tools
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review'
        run: make setup-quality

      - name: Staticcheck
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review'
        run: make lint

      - name: Race test
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review'
        run: make test-race

      - name: Fuzz smoke
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review'
        run: make fuzz-smoke
