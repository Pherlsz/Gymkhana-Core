name: CI final gate

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "VERSION"
      - "CHANGELOG.md"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
          - security

permissions:
  contents: read

concurrency:
  group: ci-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      VERIFY_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Validate semantic version carried by this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if base_version="$(git show "${BASE_SHA}:VERSION" 2>/dev/null)"; then
            :
          else
            base_version="$(git show "${BASE_SHA}:.release-please-manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["."])')"
          fi
          python scripts/release-version.py check \
            --base-version "$base_version" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
      - run: scripts/verify-local.sh "$VERIFY_SCOPE"
