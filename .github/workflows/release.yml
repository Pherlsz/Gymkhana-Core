name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate release state
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate release configuration
        run: |
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null

      - name: Simulate pending release
        env:
          RELEASE_PLEASE_TOKEN: ${{ github.token }}
        run: |
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          npx --yes release-please@17.6.0 release-pr \
            --token="$RELEASE_PLEASE_TOKEN" \
            --repo-url="$GITHUB_REPOSITORY" \
            --target-branch="$target_branch" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --dry-run

      - name: Run release checks
        if: github.event_name != 'pull_request'
        run: make check

  release:
    name: Prepare or publish release
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
