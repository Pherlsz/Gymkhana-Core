name: Bootstrap release v0.1.0

on:
  push:
    branches:
      - chore/release-v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 45061992e9f0e09611b1264ed64d0465be76d3a0
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Run release checks
        run: make check

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
          else
            gh release create v0.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target 45061992e9f0e09611b1264ed64d0465be76d3a0 \
              --title v0.1.0 \
              --generate-notes
          fi

      - name: Verify tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')"
          test "$actual" = "45061992e9f0e09611b1264ed64d0465be76d3a0"

      - name: Remove temporary release branch
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/chore/release-v0.1.0"
